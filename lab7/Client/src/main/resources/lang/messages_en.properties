LOGIN_SUCCESS=Welcome, {0}! Successful login.

#COMMANDS_NAMES
help=display help for available commands
info=print information about the collection to the standard output stream (type, initialization date, number of elements, etc.)
show=print all elements of the collection in string representation to the standard output stream
add=add a new element to the collection
update_id=update the value of the collection element whose id equals the given one
remove_by_id=remove an element from the collection by its id
clear=clear the collection
save=save the collection to a file
execute_script=read and execute a script from the specified file
exit=terminate the program (without saving to a file)
add_if_min=add a new element to the collection if its value is less than the smallest element of this collection
remove_greater=remove all elements from the collection that exceed the specified one
history=display the last 8 commands (without their arguments)
remove_all_by_price=remove all elements from the collection whose price field value is equivalent to the given one
filter_less_than_manufacture_cost=display elements whose manufactureCost field value is less than the specified one
filter_greater_than_manufacture_cost=display elements whose manufactureCost field value is greater than the specified one

#VALID_COMMANDS
valid_commands = \n\
    help                                 : display help for available commands.\n\
    info                                 : display information about the collection.\n\
    show                                 : display all elements of the collection.\n\
    add '{'element'}'                        : add a new element to the collection.\n\
    update id '{'element'}'                  : update the value of the collection element by id.\n\
    remove_by_id id                      : remove an element from the collection by its id.\n\
    clear                                : clear the collection.\n\
    save                                 : save the collection to a file.\n\
    execute_script file_name             : execute a script from the specified file.\n\
    exit                                 : terminate the program (without saving).\n\
    add_if_min '{'element'}'                 : add an element if it is less than the minimum one.\n\
    remove_greater '{'element'}'             : remove elements exceeding the specified one.\n\
    history                              : display the last 8 commands.\n\
    remove_all_by_price price            : remove elements with the specified price.\n\
    filter_less_than_cost cost           : display elements with a price lower than the specified one.\n\
    filter_greater_than_cost cost        : display elements with a price higher than the specified one.\n\
    language                             : change language.

