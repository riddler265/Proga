#COMMANDS_NAMES
help=display help for available commands
info=print information about the collection to the standard output (type, initialization date, number of elements, etc.)
show=print all elements of the collection in string representation to the standard output
add=add a new element to the collection
update_id=update the value of the collection element whose id matches the specified one
remove_by_id=remove an element from the collection by its id
clear=clear the collection
save=save the collection to a file
execute_script=read and execute the script from the specified file
exit=exit the program (without saving to a file)
add_if_min=add a new element to the collection if its value is less than the smallest element in this collection
remove_greater=remove all elements from the collection that exceed the specified one
history=display the last 8 commands (without their arguments)
remove_all_by_price=remove all elements from the collection whose price field matches the specified value
filter_less_than_manufacture_cost=display elements whose manufactureCost field is less than the specified value
filter_greater_than_manufacture_cost=display elements whose manufactureCost field is greater than the specified value